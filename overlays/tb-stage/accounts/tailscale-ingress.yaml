# Tailnet Ingress for the tb-stage Accounts web app (admin/staff). Public customer
# traffic uses public-ingress.yaml (accounts.stage-thundermail.com).
#
# Operator appends .<TAILNET>.ts.net -> accounts-stage-thundermail.tail2726a2.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: accounts-tb-stage
  namespace: accounts
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - accounts-stage-thundermail
  defaultBackend:
    service:
      name: accounts
      port:
        number: 80
