# tb-dev environment-specific, non-secret config. Layered over the base
# accounts-config ConfigMap. Hosts/URLs marked REPLACE_* are finalized as the
# data stores (#597) and OIDC wiring (#599) land.
apiVersion: v1
kind: ConfigMap
metadata:
  name: accounts-config
  namespace: accounts
data:
  # 'mzla-tb-dev' (any non-'dev' value): the app reads APP_ENV=dev as LOCAL dev
  # (http, no proxy) and disables SECURE_PROXY_SSL_HEADER, so Django would ignore the
  # tailscale ingress's X-Forwarded-Proto and emit http:// OIDC redirect_uris. The
  # secure-proxy header is gated on `not IS_DEV`, so any non-'dev' value keeps https://.
  # Using a per-env value (not 'stage') also names the Sentry environment and the
  # PostHog env tag (both = APP_ENV), keeping EKS-dev telemetry out of the real `stage`
  # streams. Verified safe: nothing branches on APP_ENV/IS_STAGE/IS_PROD. See
  # accounts-deploy docs §12.4 and platform-infrastructure#617.
  APP_ENV: "mzla-tb-dev"
  # Paddle environment (non-secret). tb-dev uses the sandbox, matching the accounts
  # STAGE setup; the PADDLE_TOKEN/API_KEY/WEBHOOK_KEY/PRICE_ID_* secrets come from the
  # ESO bundle (mzla/tb-dev/accounts, extracted from the stage Paddle creds).
  PADDLE_ENV: "sandbox"
  # Public customer host (internet-facing ALB, main.dev-thundermail.com).
  PUBLIC_BASE_URL: "https://accounts.main.dev-thundermail.com"
  # First entry is PRIMARY_EMAIL_DOMAIN and gets Stalwart mailboxes; the rest become aliases.
  # stage-thundermail.com stays primary because tb-dev forks the stage databases.
  ALLOWED_EMAIL_DOMAINS: "stage-thundermail.com,mail.tb-dev.thunderbird.dev"
  # Dev: accept any Host so the ALB target-group health check (Host = pod IP) and
  # both ingresses pass. prod must pin this to the real host.
  ALLOWED_HOSTS: "*"
  # BOTH origins: the env var REPLACES (not appends), and the tailnet admin/staff
  # POSTs still need their origin trusted alongside the public customer origin.
  CSRF_TRUSTED_ORIGINS: "https://accounts.main.dev-thundermail.com,https://accounts-main-dev-thundermail.tail2726a2.ts.net"

  # Mail client connection info shown on the dashboard (settings.CONNECTION_INFO).
  IMAP_HOST: "mail.tb-dev.thunderbird.dev"
  IMAP_PORT: "993"
  IMAP_TLS: "True"
  JMAP_HOST: "mail.tb-dev.thunderbird.dev"
  JMAP_PORT: "443"
  JMAP_TLS: "True"
  SMTP_HOST: "mail.tb-dev.thunderbird.dev"
  SMTP_PORT: "465"
  SMTP_TLS: "True"

  # Downstream Thunderbird Pro service integration (appointment on EKS, #701).
  # The tbpro dashboard "Your Services" card links out to the Appointment app.
  TB_PRO_APPOINTMENT_URL: "https://appointment.tb-dev.thunderbird.dev"
  # Allow the Appointment SPA origin for any cross-origin browser call into the
  # accounts API (CORS_ALLOWED_ORIGINS replaces, so list every allowed origin).
  CORS_ALLOWED_ORIGINS: "https://appointment.tb-dev.thunderbird.dev"

  # Accounts Postgres — Neon tb-dev branch (cloned from accounts stage), reached over
  # Neon PrivateLink (the host resolves to the shared Neon interface endpoints via
  # private DNS), NOT the ACK RDS. DATABASE_HOST/PORT come from the accounts-db-endpoint
  # ConfigMap (the RDS FieldExport is disabled in this overlay and the host set
  # statically to the Neon endpoint). The branch's db/role are the Neon defaults, not
  # `accounts`. Endpoint SG gating this: platform-infrastructure#797.
  DATABASE_NAME: "neondb"
  DATABASE_USER: "neondb_owner"

  # OIDC against the tbpro realm on the dev Customer Auth Keycloak (#599).
  # Front-channel (browser redirects) uses the PUBLIC auth host, which is also the
  # ID token issuer (keycloak KC_HOSTNAME = https://auth.main.dev-thundermail.com).
  # Back-channel (server-to-server token/userinfo/jwks + admin API) stays on the
  # in-cluster Service (transport only; tokens carry iss = the public host, so it
  # stays consistent with the front-channel host).
  OIDC_URL_AUTH: "https://auth.main.dev-thundermail.com/realms/tbpro/protocol/openid-connect/auth/"
  OIDC_URL_LOGOUT: "https://auth.main.dev-thundermail.com/realms/tbpro/protocol/openid-connect/logout/"
  OIDC_URL_TOKEN: "http://keycloak-customer.keycloak-customer.svc.cluster.local/realms/tbpro/protocol/openid-connect/token/"
  OIDC_URL_USER: "http://keycloak-customer.keycloak-customer.svc.cluster.local/realms/tbpro/protocol/openid-connect/userinfo/"
  OIDC_URL_JWKS: "http://keycloak-customer.keycloak-customer.svc.cluster.local/realms/tbpro/protocol/openid-connect/certs/"

  # Keycloak admin API (in-cluster) for the user-reconcile / MFA flows + /health.
  # KEYCLOAK_URL_REALM is derived by the app from KEYCLOAK_URL_API.
  # MUST end with a trailing slash: the app builds admin URLs with urljoin()
  # (clients.py), and urljoin(".../admin/realms/tbpro", "users/<id>") DROPS the
  # realm -> ".../admin/realms/users/<id>" -> 404 "Realm not found". The slash
  # makes tbpro a path segment so users/<id> appends correctly (matches stage).
  KEYCLOAK_URL_API: "http://keycloak-customer.keycloak-customer.svc.cluster.local/admin/realms/tbpro/"
  # Admin client for the accounts app's Keycloak admin ops. Codified here (was in
  # the SM bundle as the non-existent `thunderbird-accounts-admin`): the client that
  # exists in tb-dev's cloned master realm is `tb-accounts-admin` (a service account;
  # the one config-cli uses). Its secret stays in the bundle as KEYCLOAK_ADMIN_CLIENT_SECRET.
  KEYCLOAK_ADMIN_CLIENT_ID: "tb-accounts-admin"
  # The admin client is a service account in the MASTER realm (as on stage), so the
  # client_credentials token grant must hit /realms/master (not tbpro) -- otherwise
  # admin auth fails. It still manages tbpro via KEYCLOAK_URL_API above.
  KEYCLOAK_ADMIN_URL_TOKEN: "http://keycloak-customer.keycloak-customer.svc.cluster.local/realms/master/protocol/openid-connect/token/"

  # Stalwart (Thundermail) admin API. Thundermail runs in THIS cluster
  # (thundermail namespace), so Accounts reaches it directly over the
  # in-cluster ClusterIP Service -- no VPC peering, no admin-lb NLB hairpin. The app
  # appends `/api` to this base (mail/clients.py). The stalwart-server pod SG
  # must admit the accounts pod SG on 443.
  STALWART_BASE_API_URL: "https://stalwart-https.thundermail.svc.cluster.local"
  # Route JMAP directly at STALWART_BASE_API_URL (the private in-cluster host) instead of
  # following the apiUrl the Stalwart session advertises (which is the PUBLIC mail host,
  # mail.tb-dev.thunderbird.dev -- off the private link). With this true the client fetches the
  # session from `${base}/session` and issues JMAP calls at `${base}` directly. Requires the
  # merged client (thunderbird-accounts#1225, in the image since the mail/clients hotpatch was
  # removed, accounts-deploy#58). /.well-known/jmap must still resolve for discovery.
  STALWART_JMAP_API_IGNORE_API_URL: "true"
  # Use the v0.16 JMAP admin client (thunderbird-accounts#1131) instead of the legacy REST
  # management client. Stalwart 0.16 REMOVED the REST management API (/api/principal, /api/dkim,
  # ...), so with this false the app 404s on principal lookup after login -> 500 on / -> OIDC
  # redirect loop. `true` selects MailClientAdminJMAP, which does CRUD over the JMAP registry API.
  STALWART_ADMIN_API_USE_JMAP: "true"
  # The JMAP API ENDPOINT the admin client targets (MailClientAdminJMAP -> JMAPClient base_url).
  # MUST include the /jmap path: with IGNORE_API_URL=true the deployed client discovers the
  # session at ${url}/session and POSTs JMAP method calls to ${url}. Stalwart serves the session
  # under the JMAP prefix (.../jmap/session -> 200; the bare .../session -> 404, which caused the
  # post-login 500). So this is the private in-cluster host + /jmap, NOT the bare host. Because
  # IGNORE_API_URL=true, the client uses this URL directly and never follows the session's
  # advertised (public) apiUrl, so traffic stays on the private link.
  STALWART_JMAP_API_URL: "https://stalwart-https.thundermail.svc.cluster.local/jmap"
  # Admin auth is HTTP Basic (<user>:<secret>); the user/secret come from the ESO bundle
  # (STALWART_JMAP_API_AUTH_USER/SECRET). Without this the client defaults to Bearer and admin
  # auth fails. Not a secret -- just selects the auth scheme.
  STALWART_JMAP_API_AUTH_METHOD: "basic"
  USE_ALLOW_LIST: "True"
  # Stalwart serves its 443 cert for the public mail host (mail.tb-dev.thunderbird.dev),
  # not the in-cluster Service DNS name, so skip cert-name verification on this
  # private in-cluster link (default is true). Traffic stays TLS-encrypted and never
  # leaves the cluster/VPC.
  VERIFY_PRIVATE_LINK_SSL: "false"
