# Tailnet Ingress for the tb-dev Accounts web app (admin/staff). Public customer
# traffic uses public-ingress.yaml (accounts.main.dev-thundermail.com).
#
# Operator appends .<TAILNET>.ts.net -> accounts-main.tail2726a2.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: accounts-tb-dev
  namespace: accounts
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - accounts-main
  defaultBackend:
    service:
      name: accounts
      port:
        number: 80
