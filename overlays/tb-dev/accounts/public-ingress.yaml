# Public AWS ALB front door for the customer-facing Accounts web app on the tb-dev
# cluster (mzla-eks-tb-dev01), served at accounts.main.dev-thundermail.com.
#
# Edge architecture (DECISION):
#   - ALB Ingress (ingressClassName: alb) provisioned by the AWS Load Balancer
#     Controller (v3.4.0, SA aws-lb-controller in kube-system).
#   - TLS: the HTTPS:443 listener uses the Pulumi-managed ACM wildcard
#     *.main.dev-thundermail.com (mzla-tb-dev stack, platform-infrastructure#1453),
#     attached via certificate-arn.
#   - external-dns (Cloudflare provider, platform-infrastructure#1452) writes the
#     DNS-only record for the host in the dev-thundermail.com zone.
#   - target-type ip -> ALB registers accounts web pod IPs directly (VPC-CNI). The
#     Ingress backend points at the `accounts` ClusterIP Service (port 80), whose
#     targetPort is the pod's `http` port (:8087).
#
# Admin/staff split at the edge (docs §12.2, folds in the staged #615A deny):
#   - The Django admin (/admin*) and the staff Stalwart route (/mail/admin*) are
#     DENIED with an ALB fixed-response 403 — served by the ALB itself, so admin
#     paths never reach a pod from the public edge. Staff reach admin over the
#     tailnet ingress instead. App-level is_staff/is_superuser gating stays as
#     defense in depth. Flower stays tailnet-only (not exposed here).
#   - Rule ORDER matters: the two deny rules MUST precede the catch-all "/" forward
#     so the deny wins for those prefixes. The ALB controller orders listener rules
#     by their appearance in this spec.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: accounts-public
  namespace: accounts
  labels:
    app.kubernetes.io/name: accounts
    app.kubernetes.io/component: web
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_ME_MAIN_WILDCARD_CERT_ARN
    # Target-group health check: no healthcheck-path is set, so the ALB probes the
    # traffic port (8087) at "/". Django "/" commonly 30x-redirects (login/locale) and
    # /health 500s on dev (Stalwart unwired), so accept 2xx-3xx to keep targets Healthy.
    # Tighten to a known-200 liveness path at the real-domain cutover.
    alb.ingress.kubernetes.io/success-codes: "200-399"
    # Fixed-response 403 action reused by both deny rules below.
    alb.ingress.kubernetes.io/actions.deny-admin: >-
      {"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"403","messageBody":"Forbidden: admin is available on the internal network only."}}
    # external-dns (Cloudflare provider) publishes the public record for this host.
    external-dns.alpha.kubernetes.io/hostname: accounts.main.dev-thundermail.com
spec:
  ingressClassName: alb
  rules:
    - host: accounts.main.dev-thundermail.com
      http:
        paths:
          # Deny rules FIRST so they win over the catch-all forward below.
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: deny-admin
                port:
                  name: use-annotation
          - path: /mail/admin
            pathType: Prefix
            backend:
              service:
                name: deny-admin
                port:
                  name: use-annotation
          # Catch-all: forward customer traffic to the accounts web Service
          # (ClusterIP :80 -> pod http :8087).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: accounts
                port:
                  number: 80
