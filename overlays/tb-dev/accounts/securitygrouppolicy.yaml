# Assigns a dedicated pod security group to the Accounts web + celery pods so they
# can reach the Accounts Neon Postgres, ElastiCache Redis, and the Stalwart
# management API. Under POD_SECURITY_GROUP_ENFORCING_MODE=strict the listed SGs
# REPLACE the node SG, so a cluster SG must also be listed:
#   - sg-08c51d43c4a250a81 : the EKS-MANAGED cluster SG
#       (eks-cluster-sg-mzla-eks-tb-dev01-120464894)
#   - sg-0dba8adea7684454f : mzla-tb-dev-accounts-pod, from the
#       mzla-tb-dev pulumi output (thunderbird/platform-infrastructure#596)
#
# USE THE EKS-MANAGED CLUSTER SG, NOT THE PULUMI ONE. This previously listed
# sg-07624df6ceb8865ec (mzla-eks-tb-dev01-cluster-eksClusterSecurityGroup), which is the
# cluster's `additional` SG created by pulumi-eks. It carries no
# `kubernetes.io/cluster/mzla-eks-tb-dev01` tag, and neither does the pod SG -- so the
# AWS VPC Resource Controller could not find the cluster SG on the branch ENI and
# hot-looped:
#
#   FailedNetworkReconcile: expected exactly one securityGroup tagged with
#   kubernetes.io/cluster/mzla-eks-tb-dev01 for eni eni-..., got: []
#
# 1805 events in ~7h on this namespace alone, still firing when this was written.
# sg-08c51d43c4a250a81 is the SG EKS creates and tags itself
# (kubernetes.io/cluster/mzla-eks-tb-dev01=owned), which is what the controller looks for.
# appointment-backend/appointment-frontend on this cluster already use it and produce
# ZERO such events -- that is the working precedent this now matches.
#
# Verified before the swap that nothing depends on these pods carrying the Pulumi SG:
# a VPC-wide scan found it referenced as a source only by the node SG, for two
# control-plane->node rules (tcp/1025+ kubelet, tcp/443 extension API servers) that have
# nothing to do with application pods. Every actual accounts dependency keys off the POD
# SG (sg-0dba8...): Neon PrivateLink 5432, Redis 6379, Stalwart admin 443, Keycloak OIDC
# back-channel 8080, CoreDNS 53, stalwart-migration-proxy 8080.
#
# SAME DEFECT ELSEWHERE, not fixed here: keycloak-customer/keycloak-customer (2044
# events) and thundermail/stalwart-server also list sg-07624df6ceb8865ec. They live in
# their own repos.
apiVersion: vpcresources.k8s.aws/v1beta1
kind: SecurityGroupPolicy
metadata:
  name: accounts
  namespace: accounts
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: accounts
  securityGroups:
    groupIds:
      - sg-08c51d43c4a250a81
      - sg-0dba8adea7684454f
