apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: accounts
resources:
- ../../bases
# Public internet-facing ALB Ingress for the customer web app
# (accounts.tb-dev.thunderbird.dev, thunderbird.dev TEST domain). /admin +
# /mail/admin are denied 403 at the edge; Flower + admin stay tailnet-only.
- accounts/public-ingress.yaml
- accounts/tailscale-ingress.yaml
- accounts/flower-ingress.yaml
- accounts/securitygrouppolicy.yaml
# Argo Rollouts PREP -- both inert until accounts-web is converted to a Rollout.
# Landed ahead of the flip so the strategy change is one manifest edit rather than a
# simultaneous Service + AnalysisTemplate + ArgoCD-ignoreDifferences change across two
# repos. accounts-preview doubles as the blue-green previewService and the canary
# canaryService; accounts-web-smoke is parameterised on its target so it serves as
# prePromotionAnalysis now and canary steps[].analysis later. See each file's header.
- accounts/preview-service.yaml
- accounts/analysistemplate-web-smoke.yaml
images:
- name: REPLACE_ACCOUNTS_ECR/accounts
  newName: ghcr.io/thunderbird/thunderbird-accounts
  digest: sha256:e3749636f93d824f31f6a902936e515cdd58b3663bfb55d2087198a3b5f93884
# tb-dev HOTPATCH: generate a ConfigMap from the v0.16-ported `mail/clients/` PACKAGE
# (combined arch of PRs #1145 + #1131). The hashed name means each edit changes the CM
# name -> rolls the pods (Reloader also covers it). Mounted as a full directory over
# `mail/clients` in accounts/clients-hotpatch-mount.yaml; Python's import machinery
# prefers the mounted package dir over the image's stale `clients.py` module.
configMapGenerator:
- name: accounts-clients-hotpatch
  files:
  - __init__.py=hotpatch/clients/__init__.py
  - jmap_client.py=hotpatch/clients/jmap_client.py
  - jmap_types.py=hotpatch/clients/jmap_types.py
  - mail_client_interface.py=hotpatch/clients/mail_client_interface.py
  - mail_client_jmap.py=hotpatch/clients/mail_client_jmap.py
  - mail_client_legacy.py=hotpatch/clients/mail_client_legacy.py
  - stalwart_types.py=hotpatch/clients/stalwart_types.py
patches:
# Env-specific, non-secret config (hosts, URLs, public base URL).
- path: accounts/configmap.yaml
# dev runs a single web replica (migrations run on web boot; avoid concurrency).
- path: accounts/web-deployment.yaml
# tb-dev HOTPATCH: mount the v0.16-ported clients.py over the image copy on all
# three deployments (see accounts/clients-hotpatch-mount.yaml).
- path: accounts/clients-hotpatch-mount.yaml
# ExternalSecret remoteRef key -> mzla/tb-dev/*
- target:
    group: external-secrets.io
    version: v1
    kind: ExternalSecret
    name: accounts-secrets
  patch: |-
    - op: replace
      path: /spec/dataFrom/0/extract/key
      value: mzla/tb-dev/accounts
# accounts-db master-password ExternalSecret -> mzla/tb-dev/*
- target:
    group: external-secrets.io
    version: v1
    kind: ExternalSecret
    name: accounts-db
  patch: |-
    - op: replace
      path: /spec/data/0/remoteRef/key
      value: mzla/tb-dev/accounts-db
    - op: replace
      path: /spec/data/1/remoteRef/key
      value: mzla/tb-dev/accounts-db
# ---- ACK data stores (Redis; Postgres is now the Neon branch, #597) ----
# VPC + pod SG (sg-0dba8adea7684454f from pulumi #596) on the SG.
- target:
    group: ec2.services.k8s.aws
    version: v1alpha1
    kind: SecurityGroup
    name: accounts-redis
  patch: |-
    - op: replace
      path: /spec/vpcID
      value: vpc-0e0f4b8d603d463e0
    - op: replace
      path: /spec/ingressRules/0/userIDGroupPairs/0/groupID
      value: sg-0dba8adea7684454f
# private subnets (same as the tb-dev Stalwart subnet groups)
- target:
    group: elasticache.services.k8s.aws
    version: v1alpha1
    kind: CacheSubnetGroup
    name: accounts-redis-subnets
  patch: |-
    - op: replace
      path: /spec/subnetIDs
      value:
        - subnet-044e18f3022fb9ee1
        - subnet-01084662e5e16dce9
- target:
    group: elasticache.services.k8s.aws
    version: v1alpha1
    kind: ReplicationGroup
    name: accounts-redis
  patch: |-
    - op: replace
      path: /spec/securityGroupIDs/0
      value: sg-0be1a8015ac9b2535
# ---- tb-dev DB: Neon branch (replaced the ACK RDS) ----
# DATABASE_HOST is set statically to the Neon tb-dev branch endpoint (pooler; the app is
# Neon-pooler-safe -- DISABLE_SERVER_SIDE_CURSORS + CONN_HEALTH_CHECKS). Reached over
# Neon PrivateLink: the host resolves to the shared Neon interface endpoints via private
# DNS, gated by the accounts Neon endpoint SG (platform-infrastructure#797). The RDS
# DATABASE_HOST FieldExport is gone -- removed from bases along with the RDS itself --
# so this is the only writer of the key. Password (neondb_owner) is in
# mzla/tb-dev/accounts-db.
- target:
    version: v1
    kind: ConfigMap
    name: accounts-db-endpoint
  patch: |-
    - op: add
      path: /data/DATABASE_HOST
      value: ep-muddy-sky-a2tslt0c-pooler.eu-central-1.aws.neon.tech
